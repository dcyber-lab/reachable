name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: make test
      - run: make build
      - if: runner.os == 'Linux'
        run: make lint

  # Two network namespaces with sshd in each, faults injected with
  # iptables; see test/e2e. REQUIRE_IPV6 makes the IPv6 scenario mandatory
  # here, since the runner has IPv6 even where a dev box may not.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools the probes use
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server iproute2 iputils-ping iputils-tracepath iperf3 socat netcat-openbsd iptables \
            nftables tcpdump bpftrace ethtool
      - run: go build -o reachable .
      - run: sudo REACHABLE="$PWD/reachable" REQUIRE_IPV6=1 test/e2e/e2e.sh
